# 四端构建：Windows / macOS / Android / iOS
#
# 为什么需要 CI：
#   Windows 上**只能**构建 Windows 与 Android。macOS 与 iOS 都不行，原因是硬性的：
#     - iOS：Xcode / clang / 代码签名没有非 macOS 实现
#     - macOS：安装包要内置一个 **macOS 原生的 Python 后端**，PyInstaller 不能交叉编译
#   因此这两个产物只能交给 GitHub 的 macOS runner。
#
# 触发方式（分支模型见 docs/BRANCHING.md）：
#   - 推 `release/vX.Y.Z` 分支 → 构建四端，并**创建/更新该版本的 draft Release**（CD）。
#     版本号**取自分支名**，与 package.json 必须一致；目标是**已发布**的 Release 时直接失败
#     （已发布的资产不可被覆盖，要发行就升版本号）。
#   - 打 tag（v*）→ 同上；差别是 tag 被当作**定稿动作**，允许覆盖已发布 Release 的资产。
#   - 推 main / feat|fix|chore|docs 分支 → **只跑守门（verify）**，不打包。
#     （此前推 main 是**完全不触发**的 —— CI 对主干零设防，这是补上的洞。）
#   - Actions 页面手动触发（workflow_dispatch）→ 只构建，不碰 Release
#
# 两道闸门（都是刻意保留的，不是没做完）：
#   1. 每个打包 job 产出后要过**同源校验**（包内前端 = 本次 dist）与**架构校验**；
#   2. CD 只创建 **draft** Release、不自动公开 —— 产物必须真机验证过再执行
#        gh release edit <tag> --draft=false --latest
#      "构建成功" ≠ "能用"，自动 publish 等于把前者当后者推到用户面前。
#
# runner 标签策略：**凡有明确迁移公告的，都钉死小版本，不用 -latest**
#   - ubuntu：`ubuntu-latest` 将于 **2026-10-19** 迁到 Ubuntu 26（CI 已在刷这条注记），
#     所以钉 `ubuntu-24.04`。要升 Ubuntu 26 时改这一处、跑一遍，而不是被动接受。
#   - macos：`macos-13` 已退役（用它 job 会**永远排队**）；Intel 只剩 `macos-15-intel`
#     （官方说这是最后一个，2027-08 后 x64 mac 只能本地产）。
#   - windows：暂用 `windows-latest`（没有近期迁移公告）。

name: 四端构建

on:
  workflow_dispatch:
  push:
    branches:
      # 主干：每次合进来都要过守门。
      - main
      # 发版专线：推它 = 构建四端 + 创建/更新该版本的 draft Release（版本号取自分支名）。
      - 'release/**'
      # 开发分支：只跑守门，不打包（打包 job 的 `if` 里已排除它们）。
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
    tags:
      - 'v*'

permissions:
  contents: read

# 同一**版本**重复触发时，取消上一次还没跑完的（**哪些能取消**见下面 cancel-in-progress）。
concurrency:
  # 🔴 group 要的是「**版本**」，不是「ref」。
  #    `release/v1.7.0` 分支与 `v1.7.0` tag 是**两个不同的 ref** —— 按 `github.ref` 分组会让
  #    它们落进**不同组**，于是**并发**跑，而两者的 release job 会写**同一个** Release
  #    （一个 create、一个 upload --clobber）。后果不是"慢"，是**错**：
  #    create 撞车报 "already_exists"，或两份资产互相覆盖，让 SHA256SUMS 与实际内容对不上。
  #    归一化到版本名后，tag 构建会**排队等**分支构建跑完（组内 FIFO）。
  #    ⚠️ concurrency 里只能引用 `github` / `inputs` / `vars` 上下文；函数只用下面这两个，
  #       因为 GitHub 表达式**没有字符串切片/替换**：可用函数只有
  #       always / cancelled / case / contains / endsWith / failure / format / fromJSON /
  #       hashFiles / join / startsWith / success / toJSON —— **没有 replace**。
  #       （2026-09-29 实测：先写了 `replace(github.ref_name, 'release/', '')`，
  #         actionlint 直接报 `undefined function "replace"`。本地 YAML 依旧完全正常。）
  #       所以反过来做：把 **tag 的组名伪装成同名 release 分支的组名** ——
  #         tag `v1.7.0` → `release/v1.7.0`，与分支 `release/v1.7.0` 的 ref_name 逐字相同。
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && format('release/{0}', github.ref_name) || github.ref_name }}
  # 只有「纯守门」的触发允许被后来的推送取消（迭代快、也便宜）。
  # 🔴 tag 与 release/** 分支**必须跑完**：它们后面接着写 Release，
  #    半路取消会留下一个资产残缺的 release。
  # 🔴 必须写成 `${{ }}`：`cancel-in-progress` 只接受**单个 `${{...}}` 表达式或布尔字面量**，
  #    不写花括号会被当成纯文本 → GitHub 拒掉**整个工作流文件**。
  #    实测 2026-09-29：推上去的 run 里**一个 job 都没有**，页面只说 "workflow file issue"，
  #    本地 YAML 解析完全正常（`yaml.load` 通过）—— 是 GitHub 专属语义，不是 YAML 语法。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 守门：跨语言一致性 / 类型 / 版本号。任一不过，四端构建都不启动。
  # ─────────────────────────────────────────────────────────────
  verify:
    name: 守门 · 一致性 / 类型 / 版本
    runs-on: ubuntu-24.04
    # 🔴 六个 job 都设了 timeout-minutes —— 这是**兜「挂死」**的宽松上限，不是性能目标。
    #    不设的话中途卡住（等网络、等锁、轮询不退出）会一直烧到默认上限（6 小时），
    #    而本项目**真的发生过挂起**：退役 runner 标签让 job 既不报错也不失败地永远排队、
    #    electron-builder 退避重试、后端冒烟 60 次轮询。挂住比失败贵得多，也没有提示。
    #    取值 ≈ 正常耗时的 3~6 倍，故意留足余量（宁可慢，不可误杀）。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装前端依赖
        run: npm ci

      # 评分/角度模块只依赖 numpy（mediapipe 是惰性导入），
      # 所以重新生成期望值不需要装 opencv + mediapipe 那 400MB。
      # ⚠️ 时间戳契约守卫（verify-timefmt）额外要 aiosqlite：它跑的是**真实**的
      #    `services.retention.rollup_daily`（async）来验「迁移后归档与按天窗口同源」。
      #    用同步 sqlite3 复刻一遍是最省事的做法，但那样验的是**副本**而不是实现
      #    —— 副本会与源码各错各的，测试还全绿（本项目明令禁止）。aiosqlite 是纯
      #    Python 小包，装它只多几秒。
      - name: 安装后端最小依赖
        run: python -m pip install --quiet numpy aiosqlite

      - name: 类型检查
        run: npx tsc --noEmit

      # 期望值是由 Python 生成、node 比对的。如果只改了其中一边，
      # 提交里的 json 就会和生成器脱节 —— 这时比对本身仍在"自洽地跑"，
      # 却已经与被测实现无关了。重新生成一次并比对，堵住这个盲区。
      #
      # 🔴 TZ 必须钉成**非 UTC**：日聚合的期望值里有「本地日」用例，而 UTC 下
      #    "本地零点"就是 UTC 零点 —— 生成器自检与两端对拍都**无法区分**「按本地时区算」
      #    与「按 UTC 算」，这类回归会整条溜过去（已实测漏网过一次）。
      #    生成物本身**不随时区变化**（已验证跨 4 个时区逐字节相同），这里只是让自检有牙。
      # ⚠️ 只能靠**环境变量**钉时区，别在生成器里 spawn 子进程换 TZ：Windows CRT 上父进程
      #    TZ=UTC 时子进程拿到的是 +1:00 而不是 +8:00，嵌套传 TZ 不可靠。
      - name: 期望值是否与生成器同步
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          # 🔴 这里只列**内容能逐字节复现**的几份：
          #    - scoring / angle：原有覆盖；
          #    - daily-agg：这次时区事故补上的 —— 它的期望值曾把**生成机的 UTC 偏移**
          #      写死进去（本机 UTC+8 → 16:00Z），换到 UTC 的 runner 上两端实现都对、
          #      产物却对不上。现在生成物已做到与时区无关，加进同步检查堵住复发。
          # ⚠️ part-health / exercise-quality / export 暂不列入：前两者经 numpy 参与计算，
          #    期望值带小数字面量，而 CI 的 numpy 是**不钉版本**装的 —— 换大版本可能给出
          #    不同字面量，列入会制造假红（要纳入得先钉 numpy 版本再逐份验证）；
          #    export 则因为本机（Windows）Python 输出 CRLF、仓库文件是 LF，
          #    本地无法可靠验证，留待有 Linux 环境时再纳。
          # ⚠️ 本机比对注意换行符：先 `tr -d '\r'` 再 diff，否则会"全篇不一致"。
          # 名单必须与 scripts/ 下"生成器 + 同名 -expected.json"的配对保持一致 ——
          # 漏掉一个，那个期望值就能在"改了生成器忘了重生成"的状态下一直绿下去
          #（本轮补上 exercise-quality / export 两组，它们此前不在这个循环里）。
          for name in scoring angle daily-agg exercise-quality export; do
            echo "=== $name ==="
            python "scripts/gen-${name}-cases.py" > "/tmp/${name}.json"
            diff -u "scripts/${name}-expected.json" "/tmp/${name}.json"
          done
          echo "✓ 期望值与生成器同步"

      - name: 跨语言一致性（评分 / 平滑 / 角度）
        run: npm run verify:parity

      # 表结构层：迁移编号连续、**加列幂等**（SQLite 没有 ADD COLUMN IF NOT EXISTS）、
      # 老数据不丢、以及"同一个字段在 桌面列 / 移动端行接口 / 导出规格 三处"必须同构。
      # 它跑真实 SQLite + 真实 apply_migrations，需要 aiosqlite（同上一步的说明）。
      - name: 表结构与迁移守卫
        run: npm run verify:schema

      # 动作库数据化（ROADMAP-SCORING S7）：动作名只能存在于 src/data/exercises.ts，
      # 引导动画必须由数据驱动（不再按下标 switch），总时长单点定义。
      # 纯源码 + 数据守卫，不需要构建，所以放在 build:web 之前 —— 早期失败更便宜。
      - name: 动作库守卫（唯一数据源 / 逐项对拍 / 引导数据化）
        run: npm run verify:exercises

      # README 下载区：只允许「指向 Releases 页」的入口，不许写死版本号 / 体积 /
      # 逐版本下载链接（那三者每发一版都会漂，历史上真的漂过、也漏过）。
      # 纯文本守卫，不需要构建。
      - name: README 下载区守卫
        run: npm run verify:readme

      # 本工作流自己的守卫：on:/if:/concurrency 决定了「什么触发构建、什么对外发布」，
      # 改错了既没有编译错误、也没有别的测试会红。盯的是 --
      # 打包 job 的 if 还在不在、`--draft` 闸门在不在、tag 会不会被半路取消。
      # 纯文本守卫（按缩进取块），不需要构建，也不装依赖。
      - name: CI 工作流守卫
        run: npm run verify:ci

      # 界面层：把「构建成功、类型通过、产物 sha256 对得上，但页面白屏 /
      # 路由指不到 / ?platform= 覆盖失效」挡在提交阶段。
      # 数值层（verify:parity）与产物层（verify:source）之间原本空着这一层，
      # 详见 docs/MULTIPLATFORM.md §9.8。
      #
      # 🔴 用 runner 自带的 Chrome，**不引 playwright/puppeteer**：
      #    ① 这道门要便宜（几十秒），不该拖 100MB+ 浏览器进 CI；
      #    ② 守卫的依赖越少，守卫自己坏掉的概率越低 —— 守卫坏了会伪装成全绿。
      #    ubuntu-24.04 镜像预装 google-chrome；找不到时脚本会**显式失败**而不是跳过。
      - name: 构建前端（UI 冒烟的前置）
        run: npm run build:web

      - name: UI 冒烟（5 个平台 × 3 个路由）
        run: npm run verify:ui

      - name: 版本号五处一致
        run: node scripts/set-version.js --check

  # ─────────────────────────────────────────────────────────────
  # Windows 桌面安装包（NSIS）
  # ─────────────────────────────────────────────────────────────
  desktop-windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: verify
    # 兜「挂死」的宽松上限（正常约 15 分钟：pip 装 mediapipe/opencv + PyInstaller + NSIS）。
    timeout-minutes: 90
    # 🔴 只有「要出产物」的触发才打包：release/** 分支、tag、手动。
    #    推 main 与 feat|fix|chore|docs 分支**只跑守门** —— 否则每次提交都要烧四个 runner，
    #    而绝大多数提交根本不打算发版。
    if: >-
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端（桌面模式，含 Electron 入口）
        run: npx vite build

      - name: 打后端可执行文件
        run: npm run backend:build

      # 拦住"后端产物与目标平台不符"这一整类问题
      # （打包会成功，但装到目标机器上后端永远起不来）
      # ⚠️ 显式带 `--target=win`：不带的话判据退化成"宿主平台是什么"，而宿主是 runner 决定的
      #    —— 一旦 base 镜像换成非 Windows，或本机复跑，这条断言就静默失去意义。
      - name: 校验后端产物平台
        run: npm run verify:backend -- --target=win

      - name: 打包安装包
        run: npx electron-builder --win --publish never

      # 打包会成功、程序也能启动，但里面的前端可能是旧 dist（残留/被覆盖/忘了重建）。
      # 这类问题只在用户手上暴露，所以发布前用内容哈希钉死。
      # 比的是 electron-builder 保留的解包目录，不需要去拆 NSIS。
      - name: 同源校验（包内前端 = 本次 dist）
        run: npm run verify:source -- --packed=release2/win-unpacked/resources/app/dist/assets

      # 🔴 前面全是"静态检查产物对不对"，这一步是**唯一**能回答
      #    "这个包在 Windows 上到底能不能跑"的自动化手段 —— 与 macOS job 的同名步骤对称。
      #    背景：macOS 早就有这条，Windows（**主力分发平台**）反而一直没有，只查了 PE 格式与
      #    前端哈希。而"格式对 + 哈希对"推不出"起得来"：端口占用、DB 初始化失败、
      #    PyInstaller 漏收动态库、路径解析错，这些全都只有在真的跑一次时才暴露。
      #    它能抓到：PE 能执行 / 端口能监听 / 数据库能初始化 / 路径解析正确。
      #    仍验不到的（需人工在真机跑）：安装器 UI、Electron 窗口、摄像头链路、SmartScreen 拦截。
      # ⚠️ 必须 `shell: bash`：windows runner 默认是 pwsh，下面这段是 POSIX 写法。
      #    runner 自带 Git Bash，且这样与 macOS 那条保持**同一套语句与同一套报错文案**，
      #    不会出现"两端各写一遍、各错各的"。
      # ⚠️ 跑的是 release2/win-unpacked 里的**解包副本**，而安装包（NSIS）在上一步
      #    "打包安装包"就已经生成 → 这里产生的运行时数据**不会**进安装包。
      - name: 后端启动冒烟（跑解包后的 exe，等 /api/health）
        shell: bash
        run: |
          set -euo pipefail
          BE="release2/win-unpacked/resources/neckguardian-backend/neckguardian-backend.exe"
          if [ ! -f "$BE" ]; then
            echo "::error::解包目录里找不到后端：$BE"
            ls -la release2/win-unpacked/resources/ || true
            exit 1
          fi
          LOG="$RUNNER_TEMP/backend-smoke.log"
          "$BE" > "$LOG" 2>&1 &
          PID=$!
          echo "后端 PID = $PID"

          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::后端进程在就绪前就退出了（第 ${i} 次探测）"
              tail -80 "$LOG" || true
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:18920/api/health -o "$RUNNER_TEMP/health.json" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          if [ "$ready" -ne 1 ]; then
            echo "::error::120 秒内 /api/health 未就绪"
            tail -80 "$LOG" || true
            exit 1
          fi
          echo "健康检查响应: $(cat "$RUNNER_TEMP/health.json")"
          grep -q '"status":"ok"' "$RUNNER_TEMP/health.json" \
            || { echo "::error::/api/health 没有返回 status=ok"; exit 1; }
          echo "--- 后端启动日志 ---"
          tail -20 "$LOG" || true

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-Windows
          path: |
            release2/*.exe
            release2/*.blockmap
          if-no-files-found: error
          # ⚠️ 默认保留 90 天。构建只在 release 分支 / tag / 手动时发生，
          #    失败的发布尝试会留下一堆"永远不会再被下载"的产物占配额。
          #    30 天足够覆盖"发布后发现某端要补资产，从 CI 产物重传"这条流程。
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # macOS 桌面安装包（dmg + zip）
  #
  # ⚠️ 两种架构**必须分别在对应架构的 runner 上构建**：
  #    内置的 Python 后端是单架构 Mach-O，PyInstaller 不能交叉编译。
  #    macos-15-intel = Intel(x64)，macos-15 = Apple Silicon(arm64)。
  # 🔴 标签有保质期，别写死后不管：
  #    - `macos-13`（原 Intel 镜像）已于 **2025-12-04 彻底退役**。用它 job 会**永远排队**，
  #      既不报错也不失败（2026-09-23 实测：其他 job 全跑完后它仍 queued）。
  #      官方给标准 runner 的 Intel 替代标签是 `macos-15-intel`（支持到 2027-08）。
  #    - `macos-14` 的弃用支持 **2026-11-02 到期**，故 arm64 直接用 `macos-15`。
  #    - Apple 已停止支持 x86_64，`macos-15-intel` 是**最后一个** Intel 镜像；
  #      2027-08 之后 x64 包只能本地出。
  # ─────────────────────────────────────────────────────────────
  desktop-macos:
    name: macOS 安装包（${{ matrix.arch }}）
    runs-on: ${{ matrix.runner }}
    needs: verify
    # 兜「挂死」的宽松上限（每个矩阵项各算一次；正常约 20~30 分钟）。
    timeout-minutes: 90
    # if 同 desktop-windows：只打包 release 分支 / tag / 手动。
    if: >-
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    env:
      # CI 上没有签名证书，关掉自动发现，否则 electron-builder 会尝试签名并失败
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端（桌面模式）
        run: npx vite build

      - name: 打后端可执行文件
        run: npm run backend:build

      - name: 校验后端产物平台与架构
        run: npm run verify:backend -- --target=mac --arch=${{ matrix.arch }}

      # 🔴 关掉 Spotlight 索引：electron-builder 打完 dmg 会 `hdiutil detach`，
      #    而 mds/Spotlight 正在索引刚挂载的卷时会报
      #    `hdiutil: couldn't eject "disk2" - Resource busy`（退出码 16），打包就此失败。
      #    2026-09-23 实测：arm64 同轮通过、x64 挂在这里 → 属**偶发**，不是代码问题。
      - name: 关闭 Spotlight 索引
        run: sudo mdutil -a -i off || true

      - name: 打包 dmg + zip（未签名）
        run: |
          set +e
          for attempt in 1 2 3; do
            npx electron-builder --mac --${{ matrix.arch }} --publish never
            rc=$?
            [ $rc -eq 0 ] && exit 0
            echo "::warning::electron-builder 第 $attempt 次失败（退出码 $rc），清理残留挂载点后重试"
            for vol in /Volumes/NeckGuardian*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force
            done
            sleep 10
          done
          echo "::error::electron-builder 连续 3 次失败"
          exit 1

      # 🔴 断言产物集合与本 job 的架构严格一致。
      #    背景：electron-builder.yml 里 target 层若写了 `arch:` 列表，会**静默覆盖**
      #    命令行的 `--${{ matrix.arch }}`，于是这个 job 会把另一架构的包也打一遍。
      #    那不是"多打一个包"这么轻——后端只 build 一次，另一架构的包里的后端架构是错的。
      #    校验日志全绿也拦不住，只能在这里断言产物名。
      - name: 校验只产出本架构的包
        run: |
          ls -lh release2/
          other=${{ matrix.arch == 'x64' && 'arm64' || 'x64' }}
          if ls release2/ | grep -q -- "-$other\."; then
            echo "::error::macOS ${{ matrix.arch }} 的产物里混入了 $other 的包 —— 检查 electron-builder.yml 里 target 的 arch 列表"
            exit 1
          fi
          cnt=$(ls release2/*.dmg release2/*.zip 2>/dev/null | wc -l | tr -d ' ')
          if [ "$cnt" -ne 2 ]; then
            echo "::error::期望 2 个产物（dmg + zip），实际 $cnt 个"
            exit 1
          fi

      # 包内前端必须就是本次构建的 dist（比解包目录，不用挂 dmg）
      # ⚠️ 目录名是 `mac-arm64` / `mac` 两种，用 mac* 通配，别写成 mac-*
      - name: 同源校验（包内前端 = 本次 dist）
        run: |
          APP=$(ls -d release2/mac*/NeckGuardian.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到解包后的 .app（release2/mac*/）"
            ls -la release2/
            exit 1
          fi
          echo "app = $APP"
          npm run verify:source -- --packed="$APP/Contents/Resources/app/dist/assets"

      # 🔴 产物层面的断言：下面这些东西**打包成功完全保证不了**，
      #    但缺任何一项都等于"装上去用不了"，而且报错信息会把人引向错误方向
      #    （缺权限声明 → 进程被系统直接终止，看起来像"闪退/崩溃"，不像权限问题）。
      - name: 校验包内关键资源（权限声明 / 后端架构 / 可执行位）
        run: |
          set -euo pipefail
          APP=$(ls -d release2/mac*/NeckGuardian.app | head -1)
          echo "app = $APP"

          # 1) 摄像头权限声明。macOS 上**必须**有：
          #    缺失时请求摄像头不是"权限被拒"，而是进程被系统**直接终止**。
          CAM=$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Contents/Info.plist" 2>/dev/null || true)
          if [ -z "$CAM" ]; then
            echo "::error::$APP/Contents/Info.plist 缺 NSCameraUsageDescription —— 一开摄像头进程就被终止"
            /usr/libexec/PlistBuddy -c 'Print' "$APP/Contents/Info.plist" || true
            exit 1
          fi
          echo "NSCameraUsageDescription = $CAM"

          # 2) 内置后端：必须是本架构的 Mach-O，且**保留可执行位**。
          #    可执行位在 zip 压缩 / 解压 / 复制链路里最容易静默丢失，
          #    丢了以后 spawn 报 EACCES，看起来像"后端起不来"。
          BE="$APP/Contents/Resources/neckguardian-backend/neckguardian-backend"
          if [ ! -f "$BE" ]; then
            echo "::error::包内找不到后端可执行文件：$BE"
            ls -la "$APP/Contents/Resources/" || true
            exit 1
          fi
          want=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          file "$BE"
          file "$BE" | grep -q "Mach-O 64-bit executable $want" \
            || { echo "::error::后端架构与本 job 的 ${{ matrix.arch }}（期望 $want）不符"; exit 1; }
          if [ ! -x "$BE" ]; then
            echo "::error::后端可执行文件丢了可执行位（chmod +x 后重打包）"
            ls -l "$BE"
            exit 1
          fi

      # 🔴 前面全是"静态检查产物对不对"，这一步是**唯一**能回答
      #    "这个包装在 Mac 上到底能不能跑"的自动化手段。
      #    macOS runner 就是真 Mac，直接在 .app 里把内置后端跑起来，等 /api/health。
      #    它能抓到：Mach-O 能执行 / 端口能监听 / 数据库能初始化 / 路径解析正确
      #    —— 这些在 Windows 打包时验不出来（后端必须是宿主平台编译的产物）。
      #    仍验不到的（需人工在真机跑）：Electron 窗口、摄像头链路、签名与 Gatekeeper。
      - name: 后端启动冒烟（跑 .app 内后端，等 /api/health）
        run: |
          set -euo pipefail
          APP=$(ls -d release2/mac*/NeckGuardian.app | head -1)
          BE="$APP/Contents/Resources/neckguardian-backend/neckguardian-backend"
          LOG=/tmp/backend-smoke.log
          "$BE" > "$LOG" 2>&1 &
          PID=$!
          echo "后端 PID = $PID"

          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::后端进程在就绪前就退出了（第 ${i} 次探测）"
              tail -80 "$LOG" || true
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:18920/api/health -o /tmp/health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          if [ "$ready" -ne 1 ]; then
            echo "::error::120 秒内 /api/health 未就绪"
            tail -80 "$LOG" || true
            exit 1
          fi
          echo "健康检查响应: $(cat /tmp/health.json)"
          grep -q '"status":"ok"' /tmp/health.json \
            || { echo "::error::/api/health 没有返回 status=ok"; exit 1; }
          echo "--- 后端启动日志 ---"
          tail -20 "$LOG" || true

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-macOS-${{ matrix.arch }}
          path: |
            release2/*.dmg
            release2/*.zip
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Android APK
  #
  # 本机（Windows）已经能出正式包；这个任务的价值是**在干净环境里验证可构建性**，
  # 同时避免本地工具链（E:/AndroidDev）与 CI 的差异被长期掩盖。
  # 提供签名 secrets 时出正式包，否则只出 debug 包（不可分发）。
  # ─────────────────────────────────────────────────────────────
  mobile-android:
    name: Android APK
    runs-on: ubuntu-24.04
    needs: verify
    # 兜「挂死」的宽松上限（正常约 15~25 分钟：Gradle 首次拉依赖最慢）。
    timeout-minutes: 60
    # if 同 desktop-windows：只打包 release 分支 / tag / 手动。
    if: >-
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 不用 `android-actions/setup-android@v3`：它内部会执行 `sdkmanager tools`，
      #    而 `tools` 包早已从 SDK 仓库移除 → `Warning: Failed to find package 'tools'`
      #    然后整个 action 以退出码 1 失败（2026-09-23 CI 实测）。
      #    ubuntu runner 本身就带 Android SDK，直接用自带的即可。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::找不到 Android SDK（$SDK）"; exit 1; }
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            # runner 上 cmdline-tools 的版本目录名会变（16.0 / latest / …），按目录找而不是写死
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "SDK        = $SDK"
          echo "sdkmanager = $SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # `yes |` 会因 SIGPIPE 得到非 0 退出码，必须兜住
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: 安装依赖
        run: npm ci

      # 项目 compileSdk/targetSdk = 34，构建工具 34.0.0（见 android/variables.gradle）
      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 写入签名配置（仅在提供 secrets 时）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未提供 ANDROID_KEYSTORE_BASE64，跳过签名配置（只会产出 debug 包）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/neckguardian-release.jks"
          cat > "$GITHUB_WORKSPACE/android/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/neckguardian-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 APK
        run: |
          if [ -f android/keystore.properties ]; then
            echo "检测到签名配置 → 构建 release 包"
            node scripts/android-build.js --release
          else
            echo "::warning::未提供签名 secrets，仅产出 debug 包（不可分发）"
            node scripts/android-build.js
          fi

      # 把「是否已签名 / 能不能分发」直接写进文件名。
      # 下游的 Release 步骤靠这个后缀判断该不该上传 —— debug 包绝不能发出去。
      - name: 规范产物名
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -f android/keystore.properties ]; then kind=release; else kind=debug; fi
          APK=$(find android/app/build/outputs/apk -name '*.apk' | sort | head -1)
          [ -n "$APK" ] || { echo "::error::没找到 APK"; exit 1; }
          mkdir -p release2
          cp "$APK" "release2/NeckGuardian-$VER-android-$kind.apk"
          echo "APK 源文件 = $APK"
          ls -lh release2/*.apk

      # 🔴 证书指纹是**不可再生**的：APK 的文件 sha256 每次构建都变，但证书指纹必须与
      # 历史逐位一致 —— 一变，老用户就只能卸载重装（签名冲突），本地数据全丢。
      # 这条过去是发布前的手工检查（docs/MULTIPLATFORM.md §9.3），而手工步骤一定会漏；
      # 漏了的后果要等用户装不上才发现。放在这里自动拦。
      #
      # ⚠️ 解析**不依赖 apksigner 的输出格式**：不同的 build-tools 版本输出前缀不一样
      #    （2026-09-24 首跑就是栽在这里：`awk -F': ' '{print $2}'` 取到了
      #    "certificate SHA-256 digest" 而不是指纹）。改为「在含 SHA-256 的行里抓第一段
      #    64 位十六进制」，并对「解析不出来」与「指纹不一致」报不同的错 —— 前者是守卫坏了，
      #    后者才是密钥变了，混为一谈会误拦发布。
      - name: 校验签名证书指纹（须与历史一致）
        run: |
          set -euo pipefail
          APK=$(ls release2/*-android-release.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::warning::本次没有 release 包（未提供签名 secrets）→ 跳过指纹校验"
            exit 0
          fi
          EXPECTED="9adaa8b20c384eae1a6ed4f57dbd2d98b3965838f0661c2b88fca3031b3a2bd5"

          # 优先用工程指定的 34.0.0；runner 上可能预装了更新的 build-tools，
          # 它们的输出格式不同，别再靠 `sort | tail -1` 撞运气。
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/34.0.0/apksigner 2>/dev/null | head -1 || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -1 || true)
            echo "::warning::未找到 build-tools 34.0.0，改用 $APKSIGNER"
          fi
          [ -n "$APKSIGNER" ] || { echo "::error::找不到 apksigner"; exit 1; }
          echo "apksigner  = $APKSIGNER"

          CERT_OUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "----- apksigner 原始输出 -----"
          echo "$CERT_OUT"
          echo "-----------------------------"
          ACTUAL=$(printf '%s\n' "$CERT_OUT" \
            | grep 'SHA-256' \
            | grep -oE '[0-9a-fA-F]{64}' \
            | head -1 | tr 'A-F' 'a-f' || true)

          if [ -z "$ACTUAL" ]; then
            echo "::error::没能从 apksigner 输出里解析出 SHA-256 指纹 —— 大概率是 apksigner 版本变了、输出格式改了，**不是**密钥变了。原始输出见上。"
            exit 1
          fi

          echo "期望指纹 = $EXPECTED"
          echo "实际指纹 = $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名证书指纹与历史不一致！老用户将无法覆盖安装（签名冲突，只能卸载重装、本地数据全丢）。"
            echo "::error::若确属**有意换密钥**，须同步更新本步骤与 docs/MULTIPLATFORM.md §9.3 的期望值，并在 Release 说明里明确告知需先卸载。"
            exit 1
          fi
          echo "✅ 指纹与历史一致，老用户可覆盖安装"

      - name: 解出 APK 内的前端
        run: |
          APK=$(ls release2/*-android-*.apk | head -1)
          rm -rf /tmp/apk && mkdir -p /tmp/apk
          unzip -q "$APK" -d /tmp/apk
          ls /tmp/apk/assets/public/

      # 用真 APK 里的资源比对，而不是 cap 复制过去的中间目录 —— 后者绕过了
      # AGP 的资源处理（混淆/裁剪），理论上存在"中间目录对、包内不对"的可能。
      - name: 同源校验（APK 内前端 = 本次 dist）
        run: npm run verify:source -- --packed=/tmp/apk/assets/public/assets

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-Android
          path: release2/*.apk
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # iOS 归档
  #
  # 默认走**未签名归档**：足以证明 iOS 目标可编译、Capacitor 工程可用，
  # 且不需要 Apple 开发者账号就能在 CI 上跑通。
  # 要出可安装/可上架的 IPA，需要额外配置签名证书（见 docs/MULTIPLATFORM.md）。
  # ─────────────────────────────────────────────────────────────
  mobile-ios:
    name: iOS 归档
    # macos-15：`macos-14` 的弃用支持 2026-11-02 到期，别贴着期限走
    runs-on: macos-15
    needs: verify
    # 兜「挂死」的宽松上限（正常约 20~35 分钟：pod install + xcodebuild archive 都慢）。
    timeout-minutes: 90
    # if 同 desktop-windows：只打包 release 分支 / tag / 手动。
    if: >-
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 脚本内部会做三件事：前端构建（含 MediaPipe 资源暂存）→ cap sync ios
      # → pod install → xcodebuild archive（未签名）
      - name: 构建并归档
        run: node scripts/ios-build.js

      # 与 Android 同理：验**归档里实际那份**（`.app/public/assets`），
      # 而不是 cap sync 复制到工程目录的中间态 —— 后者没经过 Xcode 的处理流程。
      - name: 同源校验（归档内的前端 = 本次 dist）
        run: |
          set -euo pipefail
          ASSETS="$(find release2/ios/NeckGuardian.xcarchive -type d -path '*/public/assets' | head -1)"
          if [ -z "$ASSETS" ]; then
            echo "::error::归档里找不到 public/assets，无法校验同源"
            find release2/ios/NeckGuardian.xcarchive -maxdepth 6 -type d | head -40
            exit 1
          fi
          echo "归档内前端目录 = $ASSETS"
          npm run verify:source -- --packed="$ASSETS"

      # 🔴 归档产物的静态断言。
      #    最容易踩的一条是 NSCameraUsageDescription：iOS 上缺它不是"权限被拒"，
      #    而是**一调用摄像头就闪退**，且日志里只有 SIGABRT，排查方向极易跑偏。
      - name: 校验归档产物（权限声明 / 架构 / 可安装性）
        run: |
          set -euo pipefail
          PLIST=$(find release2/ios/NeckGuardian.xcarchive -type f -path '*Products/Applications/*.app/Info.plist' | head -1)
          if [ -z "$PLIST" ]; then
            echo "::error::归档里找不到 .app/Info.plist"
            find release2/ios/NeckGuardian.xcarchive -maxdepth 6 | head -40
            exit 1
          fi
          echo "Info.plist = $PLIST"

          CAM=$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$PLIST" 2>/dev/null || true)
          if [ -z "$CAM" ]; then
            echo "::error::缺 NSCameraUsageDescription —— 装到设备后一开摄像头就闪退（不是权限被拒）"
            /usr/libexec/PlistBuddy -c 'Print' "$PLIST" || true
            exit 1
          fi
          echo "NSCameraUsageDescription = $CAM"

          # 本项目只做摄像头姿态检测、音频只做输出（Constraints: audio=false），
          # 因此**不应**出现麦克风声明；出现了说明配置漂了。
          if /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$PLIST" >/dev/null 2>&1; then
            echo "::warning::Info.plist 出现 NSMicrophoneUsageDescription，但本项目不需要麦克风"
          fi

          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          [ "$BID" = "com.neckguardian.app" ] || { echo "::error::BundleID 变成了 $BID"; exit 1; }
          echo "BundleID = $BID"

          APP=$(dirname "$PLIST")
          file "$APP/App"
          file "$APP/App" | grep -q "Mach-O 64-bit" || { echo "::error::主二进制不是 Mach-O"; exit 1; }

          # 🔴 说清楚这个产物**是什么**：CI 没有签名证书，
          #    产出的是开发者归档（xcarchive），**不是**可安装的 IPA。
          #    想装到设备必须由持有 Apple 开发者证书的人用 Xcode 重新签名导出。
          if [ -e "$APP/embedded.mobileprovision" ]; then
            echo "::warning::归档里出现了 embedded.mobileprovision（CI 未配置签名，出现在这里属异常）"
          else
            echo "::notice::该产物为未签名开发者归档（.xcarchive），不可直接安装；分发需另行签名导出 IPA"
          fi

      # xcarchive 是目录，打包成单个文件才能作为 artifact 上传
      - name: 打包归档
        run: |
          mkdir -p release2/ios
          tar -czf release2/ios/NeckGuardian.xcarchive.tgz -C release2/ios NeckGuardian.xcarchive

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-iOS
          path: release2/ios/NeckGuardian.xcarchive.tgz
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # CD：推 release 分支 / 打 tag 时把四端产物汇总成一个 **draft** Release
  #
  # 🔴 为什么是 draft 而不是直接 publish
  #    "构建成功" ≠ "能用"。mac / iOS 产物至今**没有做过真机验证**，
  #    Android 的摄像头链路也只在 v1.3.4 验过一轮。Release 一旦公开就有人下载，
  #    所以留一道人工闸门 —— 确认无误后再：
  #        gh release edit <tag> --draft=false --latest
  #    （这是刻意设计，不是没做完。要全自动就把下面的 `--draft` 去掉。）
  #
  # ⚠️ 手动 dispatch **不碰 Release**（只构建）—— 所以这个 job 的 `if:` 里没有 workflow_dispatch，
  #    而四个打包 job 有。别把两处改成一样。
  #
  # 🔴 Android：CI 只有在提供签名 secrets 时才出正式包，否则产出的是
  #    **debug 包（不可分发）** → 这里直接剔除，不进 Release。
  #    本机出正式包后补传：
  #        npm run cap:build:release
  #        gh release upload <tag> "release2/NeckGuardian-<ver>-android-release.apk" --clobber
  # ─────────────────────────────────────────────────────────────
  release:
    name: 汇总产物 · 创建/更新 draft Release
    runs-on: ubuntu-24.04
    # 兜「挂死」的宽松上限（正常约 2~4 分钟：下载四个 artifact + 上传）。
    # ⚠️ 里面有个**故意留的**重试轮询（等资产可查，见下），所以别设太紧。
    timeout-minutes: 30
    needs:
      - desktop-windows
      - desktop-macos
      - mobile-android
      - mobile-ios
    # 发布只发生在「定稿性」的触发上：tag、或 release/** 分支。
    # 手动 dispatch 只构建、不碰 Release。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 汇总产物并核对版本号
        run: |
          set -euo pipefail
          echo "=== artifact 原始结构 ==="
          find artifacts -type f | sort

          mkdir -p dist-release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.apk' -o -name '*.tgz' \) \
            -exec cp -v {} dist-release/ \;

          echo "=== 待发布 ==="
          ls -lh dist-release/

          # 版本号的唯一来源按触发分两种：
          #   - tag  v1.3.8 / v1.3.8-rc1                → 版本取 tag 名
          #   - 分支 release/v1.3.8 / release/v1.3.8-rc1 → 版本取分支名，tag 补成 v1.3.8
          # 两者都必须与 package.json 一致，否则会发出版本号错乱的 Release。
          # 允许预发布后缀：v1.3.8-rc1、v1.3.8-cdverify 都按 1.3.8 校验
          # （这样预演 CD 不用动 package.json 的版本号）。
          #
          # 🔴 分支名允许带**或不带** `v`：`release/v1.7.0` 与 `release/1.7.0` 都合法。
          #    2026-09-29 实测踩到：原先写的是 `TAG="v${GITHUB_REF_NAME#release/}"`，
          #    而文档与建模都约定分支叫 `release/v1.7.0`（带 v）——
          #    于是拼成 `vv1.7.0`、比对基准变成 `v1.7.0`，release job 直接失败：
          #      `::error::branch release/v1.7.0 与 package.json 版本 1.7.0 不一致`
          #      `::error::…请先把版本号 bump 到位：node scripts/set-version.js v1.7.0`
          #    （报错里那句"建议"带着 `v` 就是线索：`set-version.js` 要的是不带 v 的版本号。）
          #    修法是把分支名的 `v` **可选地**剥掉，两种拼法都落到同一个 TAG 上 ——
          #    这也是 `concurrency.group` 能把 tag 与分支归一化到同一组的前提（见 verify:ci 断言 15）。
          VER=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            FROM_TAG=1
          else
            BRANCH_VER="${GITHUB_REF_NAME#release/}"   # v1.7.0 或 1.7.0 或 v1.7.0-rc1
            TAG="v${BRANCH_VER#v}"                     # → v1.7.0 / v1.7.0 / v1.7.0-rc1
            FROM_TAG=0
          fi
          BASE="${TAG#v}"; BASE="${BASE%%-*}"
          echo "package.json=$VER  ref=${GITHUB_REF_NAME}  目标 tag=$TAG  (比对基准=$BASE)"
          if [ "$VER" != "$BASE" ]; then
            echo "::error::${GITHUB_REF_TYPE} ${GITHUB_REF_NAME} 与 package.json 版本 $VER 不一致"
            echo "::error::分支构建请先把版本号 bump 到位：node scripts/set-version.js ${BASE}"
            exit 1
          fi
          # 写成 env 给后面的步骤用：每步各自重推一遍 tag，推错了就是发错版本。
          {
            echo "RELEASE_TAG=$TAG"
            echo "FROM_TAG=$FROM_TAG"
          } >> "$GITHUB_ENV"

      - name: 剔除不可分发的 Android debug 包
        run: |
          set -euo pipefail
          if ls dist-release/*-android-debug.apk >/dev/null 2>&1; then
            echo "::warning::CI 未提供签名 secrets → 只有 debug 包，已从 Release 资产中剔除"
            echo "::warning::Android 正式包请本机 npm run cap:build:release 后 gh release upload 补传"
            rm -f dist-release/*-android-debug.apk
          fi
          ls -lh dist-release/

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist-release
          # 🔴 校验和里必须写**用户在 GitHub 上下载到的文件名**，不是本地文件名。
          #    GitHub 会把资产名里的连续空白压成一个点：
          #      `NeckGuardian Setup 1.3.7.exe`  → `NeckGuardian.Setup.1.3.7.exe`
          #      `d  e.txt`（两个空格）          → `d.e.txt`（实测：连续空白合并成一个点）
          #    照抄本地名的话，用户下载后按 release 说明跑 `sha256sum -c SHA256SUMS.txt`
          #    会因为「找不到文件」而整条 FAILED —— 白给一份没法用的校验文件。
          for f in *; do
            if [ "$f" = "SHA256SUMS.txt" ]; then continue; fi
            h=$(sha256sum "$f" | awk '{print $1}')
            ghname=$(printf '%s' "$f" | sed -E 's/[[:space:]]+/./g')
            printf '%s  %s\n' "$h" "$ghname"
          done > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 / 更新 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
            # 🔴 已发布的 Release 是**对外契约**：资产和 SHA256SUMS 已经被人下载、也被
            #    README 的 releases/latest 指向。分支构建只允许写 draft —— 要发行就往上
            #    升版本号，不要去覆盖别人手上的下载。
            #    （tag 触发是定稿动作，保留原有的 --clobber 覆盖能力。）
            if [ "$IS_DRAFT" != "true" ] && [ "$FROM_TAG" != "1" ]; then
              echo "::error::Release $TAG 已发布（非 draft），分支构建不许覆盖它的资产"
              echo "::error::请升版本号后重开 release 分支：node scripts/set-version.js <新版本>"
              exit 1
            fi
            echo "Release $TAG 已存在（draft=$IS_DRAFT）→ 覆盖上传资产"
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "NeckGuardian ${TAG}" \
              --notes-file .github/release-notes.md \
              --generate-notes \
              dist-release/*
          fi

      # 🔴 回读校验。`gh release create/upload` 返回 0 **不等于**资产已经可查 ——
      #    这一步把"看起来传上去了"变成断言，盯两件事：
      #      ① 资产**数量**对不对（少一个 = 某个端静默没进 Release）；
      #      ② SHA256SUMS.txt 里写的文件名**与 GitHub 实际资产名逐个一致**。
      #    为什么要②：GitHub 会改写资产名里的连续空白（`NeckGuardian Setup 1.7.0.exe`
      #    → `NeckGuardian.Setup.1.7.0.exe`）。生成校验文件时若照抄本地名，
      #    用户按 Release 说明跑 `sha256sum -c SHA256SUMS.txt` 会整条 FAILED「找不到文件」
      #    —— 白给一份**没法用的**校验文件，而且只有用户会发现。
      #    ⚠️ ①要轮询：release 刚创建时查询接口有最终一致性延迟（实测 create 成功 19 秒后
      #       仍返回 assets=0，几十秒后同一对象是 7 个）。只查一次极易误判 → 这里重试。
      - name: 回读校验：资产真的都传上去了，且校验文件名与线上一致
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          want=$(ls dist-release | wc -l | tr -d ' ')
          echo "期望资产数 = $want（dist-release 里的文件，含 SHA256SUMS.txt）"

          # 只在"还没追平"时重试；`got` 一旦 ≥ want 就不再等（最终一致性只会让数量增长）。
          got=0
          for i in $(seq 1 12); do
            got=$(gh release view "$TAG" --json assets --jq '.assets | length')
            echo "第 ${i} 次回读：assets=$got / 期望=$want"
            if [ "$got" -ge "$want" ]; then break; fi
            sleep 10
          done

          if [ "$got" -lt "$want" ]; then
            echo "::error::资产数不足（实际 $got < 期望 $want）—— 等了 120 秒仍未追平，不是延迟问题"
            echo "::error::线上实际资产："
            gh release view "$TAG" --json assets --jq '.assets[].name' || true
            echo "::error::本地产物："
            ls -la dist-release/ || true
            exit 1
          fi
          # 🔴 数量**多出来**是另一种问题，不能和"少传了"混成一条报错：
          #    多半是**上一次构建留下、这次已不再产出**的旧资产（改了产物名就会这样）。
          #    留着它的后果是实打实的：README 的下载区写着"在 Assets 里找这个文件名"，
          #    而 Assets 里躺着两个候选。所以这里**故意判失败**，让人去删，而不是静默放过。
          if [ "$got" -gt "$want" ]; then
            echo "::error::线上资产比本次产出的还多（实际 $got > 期望 $want）—— 多半是上次构建遗留的旧资产"
            echo "::error::请逐个确认后删除：gh release delete-asset <tag> <name>"
            gh release view "$TAG" --json assets --jq '.assets[].name' || true
            echo "::error::本地产物："
            ls -la dist-release/ || true
            exit 1
          fi

          # 线上资产名 → 与 SHA256SUMS.txt 里的名字逐个对（SHA256SUMS.txt 自己不在校验表里）
          # ⚠️ 两侧都用 `LC_ALL=C sort`：默认 locale 的排序规则可能不同，会造成假不一致。
          # ⚠️ 这里**故意不单独 cat 两份清单**：`diff -u` 在不一致时会把两侧都打出来，够定位了；
          #    而多印一次会让这两个文件名在文本里各出现两次，守卫的锚点就不再唯一。
          gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/gh-assets.txt"
          grep -v '^SHA256SUMS\.txt$' "$RUNNER_TEMP/gh-assets.txt" | LC_ALL=C sort > "$RUNNER_TEMP/gh-assets-checked.txt" || true
          sed -E 's/^[0-9a-fA-F]+[[:space:]]+//' dist-release/SHA256SUMS.txt | LC_ALL=C sort > "$RUNNER_TEMP/sums-names.txt"

          if ! diff -u "$RUNNER_TEMP/sums-names.txt" "$RUNNER_TEMP/gh-assets-checked.txt"; then
            echo "::error::SHA256SUMS.txt 的名字与线上资产名不一致 —— 用户跑 sha256sum -c 会整条 FAILED（多半是没做空白→点的转换）"
            exit 1
          fi
          echo "✅ 资产齐全（$want 个），且校验文件名与线上逐字一致"

      - name: 在 Summary 里给出后续动作
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Release 已创建为 draft"
            echo
            echo "| 资产 | 大小 |"
            echo "|---|---|"
            gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[] | "| `\(.name)` | \(.size) B |"' || true
            echo
            echo "人工确认无误后发布："
            echo
            echo '```'
            echo "gh release edit ${RELEASE_TAG} --draft=false --latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
