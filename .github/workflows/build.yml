# 四端构建：Windows / macOS / Android / iOS
#
# 为什么需要 CI：
#   Windows 上**只能**构建 Windows 与 Android。macOS 与 iOS 都不行，原因是硬性的：
#     - iOS：Xcode / clang / 代码签名没有非 macOS 实现
#     - macOS：安装包要内置一个 **macOS 原生的 Python 后端**，PyInstaller 不能交叉编译
#   因此这两个产物只能交给 GitHub 的 macOS runner。
#
# 触发方式：
#   - 打 tag（v*）→ 构建四端，并自动创建一个 **draft Release**（CD）
#   - Actions 页面手动触发（workflow_dispatch）→ 只构建，不碰 Release
#
# 两道闸门（都是刻意保留的，不是没做完）：
#   1. 每个打包 job 产出后要过**同源校验**（包内前端 = 本次 dist）与**架构校验**；
#   2. CD 只创建 **draft** Release、不自动公开 —— 产物必须真机验证过再执行
#        gh release edit <tag> --draft=false --latest
#      "构建成功" ≠ "能用"，自动 publish 等于把前者当后者推到用户面前。

name: 四端构建

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# 同一 ref 重复触发时，取消上一次还没跑完的。
# ⚠️ 只在手动触发时取消：**tag 触发的构建必须跑完**（它后面接着发 Release），
#    半路取消会留下一个空壳 release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 守门：跨语言一致性 / 类型 / 版本号。任一不过，四端构建都不启动。
  # ─────────────────────────────────────────────────────────────
  verify:
    name: 守门 · 一致性 / 类型 / 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装前端依赖
        run: npm ci

      # 评分/角度模块只依赖 numpy（mediapipe 是惰性导入），
      # 所以重新生成期望值不需要装 opencv + mediapipe 那 400MB。
      - name: 安装后端最小依赖
        run: python -m pip install --quiet numpy

      - name: 类型检查
        run: npx tsc --noEmit

      # 期望值是由 Python 生成、node 比对的。如果只改了其中一边，
      # 提交里的 json 就会和生成器脱节 —— 这时比对本身仍在"自洽地跑"，
      # 却已经与被测实现无关了。重新生成一次并比对，堵住这个盲区。
      - name: 期望值是否与生成器同步
        run: |
          python scripts/gen-scoring-cases.py > /tmp/scoring.json
          python scripts/gen-angle-cases.py   > /tmp/angle.json
          diff -u scripts/scoring-expected.json /tmp/scoring.json
          diff -u scripts/angle-expected.json   /tmp/angle.json

      - name: 跨语言一致性（评分 / 平滑 / 角度）
        run: npm run verify:parity

      - name: 版本号五处一致
        run: node scripts/set-version.js --check

  # ─────────────────────────────────────────────────────────────
  # Windows 桌面安装包（NSIS）
  # ─────────────────────────────────────────────────────────────
  desktop-windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端（桌面模式，含 Electron 入口）
        run: npx vite build

      - name: 打后端可执行文件
        run: npm run backend:build

      # 拦住"后端产物与目标平台不符"这一整类问题
      # （打包会成功，但装到目标机器上后端永远起不来）
      - name: 校验后端产物平台
        run: npm run verify:backend

      - name: 打包安装包
        run: npx electron-builder --win --publish never

      # 打包会成功、程序也能启动，但里面的前端可能是旧 dist（残留/被覆盖/忘了重建）。
      # 这类问题只在用户手上暴露，所以发布前用内容哈希钉死。
      # 比的是 electron-builder 保留的解包目录，不需要去拆 NSIS。
      - name: 同源校验（包内前端 = 本次 dist）
        run: npm run verify:source -- --packed=release2/win-unpacked/resources/app/dist/assets

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-Windows
          path: |
            release2/*.exe
            release2/*.blockmap
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # macOS 桌面安装包（dmg + zip）
  #
  # ⚠️ 两种架构**必须分别在对应架构的 runner 上构建**：
  #    内置的 Python 后端是单架构 Mach-O，PyInstaller 不能交叉编译。
  #    macos-15-intel = Intel(x64)，macos-15 = Apple Silicon(arm64)。
  # 🔴 标签有保质期，别写死后不管：
  #    - `macos-13`（原 Intel 镜像）已于 **2025-12-04 彻底退役**。用它 job 会**永远排队**，
  #      既不报错也不失败（2026-09-23 实测：其他 job 全跑完后它仍 queued）。
  #      官方给标准 runner 的 Intel 替代标签是 `macos-15-intel`（支持到 2027-08）。
  #    - `macos-14` 的弃用支持 **2026-11-02 到期**，故 arm64 直接用 `macos-15`。
  #    - Apple 已停止支持 x86_64，`macos-15-intel` 是**最后一个** Intel 镜像；
  #      2027-08 之后 x64 包只能本地出。
  # ─────────────────────────────────────────────────────────────
  desktop-macos:
    name: macOS 安装包（${{ matrix.arch }}）
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    env:
      # CI 上没有签名证书，关掉自动发现，否则 electron-builder 会尝试签名并失败
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端（桌面模式）
        run: npx vite build

      - name: 打后端可执行文件
        run: npm run backend:build

      - name: 校验后端产物平台与架构
        run: npm run verify:backend -- --target=mac --arch=${{ matrix.arch }}

      # 🔴 关掉 Spotlight 索引：electron-builder 打完 dmg 会 `hdiutil detach`，
      #    而 mds/Spotlight 正在索引刚挂载的卷时会报
      #    `hdiutil: couldn't eject "disk2" - Resource busy`（退出码 16），打包就此失败。
      #    2026-09-23 实测：arm64 同轮通过、x64 挂在这里 → 属**偶发**，不是代码问题。
      - name: 关闭 Spotlight 索引
        run: sudo mdutil -a -i off || true

      - name: 打包 dmg + zip（未签名）
        run: |
          set +e
          for attempt in 1 2 3; do
            npx electron-builder --mac --${{ matrix.arch }} --publish never
            rc=$?
            [ $rc -eq 0 ] && exit 0
            echo "::warning::electron-builder 第 $attempt 次失败（退出码 $rc），清理残留挂载点后重试"
            for vol in /Volumes/NeckGuardian*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force
            done
            sleep 10
          done
          echo "::error::electron-builder 连续 3 次失败"
          exit 1

      # 🔴 断言产物集合与本 job 的架构严格一致。
      #    背景：electron-builder.yml 里 target 层若写了 `arch:` 列表，会**静默覆盖**
      #    命令行的 `--${{ matrix.arch }}`，于是这个 job 会把另一架构的包也打一遍。
      #    那不是"多打一个包"这么轻——后端只 build 一次，另一架构的包里的后端架构是错的。
      #    校验日志全绿也拦不住，只能在这里断言产物名。
      - name: 校验只产出本架构的包
        run: |
          ls -lh release2/
          other=${{ matrix.arch == 'x64' && 'arm64' || 'x64' }}
          if ls release2/ | grep -q -- "-$other\."; then
            echo "::error::macOS ${{ matrix.arch }} 的产物里混入了 $other 的包 —— 检查 electron-builder.yml 里 target 的 arch 列表"
            exit 1
          fi
          cnt=$(ls release2/*.dmg release2/*.zip 2>/dev/null | wc -l | tr -d ' ')
          if [ "$cnt" -ne 2 ]; then
            echo "::error::期望 2 个产物（dmg + zip），实际 $cnt 个"
            exit 1
          fi

      # 包内前端必须就是本次构建的 dist（比解包目录，不用挂 dmg）
      # ⚠️ 目录名是 `mac-arm64` / `mac` 两种，用 mac* 通配，别写成 mac-*
      - name: 同源校验（包内前端 = 本次 dist）
        run: |
          APP=$(ls -d release2/mac*/NeckGuardian.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到解包后的 .app（release2/mac*/）"
            ls -la release2/
            exit 1
          fi
          echo "app = $APP"
          npm run verify:source -- --packed="$APP/Contents/Resources/app/dist/assets"

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-macOS-${{ matrix.arch }}
          path: |
            release2/*.dmg
            release2/*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Android APK
  #
  # 本机（Windows）已经能出正式包；这个任务的价值是**在干净环境里验证可构建性**，
  # 同时避免本地工具链（E:/AndroidDev）与 CI 的差异被长期掩盖。
  # 提供签名 secrets 时出正式包，否则只出 debug 包（不可分发）。
  # ─────────────────────────────────────────────────────────────
  mobile-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 不用 `android-actions/setup-android@v3`：它内部会执行 `sdkmanager tools`，
      #    而 `tools` 包早已从 SDK 仓库移除 → `Warning: Failed to find package 'tools'`
      #    然后整个 action 以退出码 1 失败（2026-09-23 CI 实测）。
      #    ubuntu runner 本身就带 Android SDK，直接用自带的即可。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::找不到 Android SDK（$SDK）"; exit 1; }
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            # runner 上 cmdline-tools 的版本目录名会变（16.0 / latest / …），按目录找而不是写死
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "SDK        = $SDK"
          echo "sdkmanager = $SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # `yes |` 会因 SIGPIPE 得到非 0 退出码，必须兜住
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: 安装依赖
        run: npm ci

      # 项目 compileSdk/targetSdk = 34，构建工具 34.0.0（见 android/variables.gradle）
      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 写入签名配置（仅在提供 secrets 时）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未提供 ANDROID_KEYSTORE_BASE64，跳过签名配置（只会产出 debug 包）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/neckguardian-release.jks"
          cat > "$GITHUB_WORKSPACE/android/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/neckguardian-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 APK
        run: |
          if [ -f android/keystore.properties ]; then
            echo "检测到签名配置 → 构建 release 包"
            node scripts/android-build.js --release
          else
            echo "::warning::未提供签名 secrets，仅产出 debug 包（不可分发）"
            node scripts/android-build.js
          fi

      # 把「是否已签名 / 能不能分发」直接写进文件名。
      # 下游的 Release 步骤靠这个后缀判断该不该上传 —— debug 包绝不能发出去。
      - name: 规范产物名
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -f android/keystore.properties ]; then kind=release; else kind=debug; fi
          APK=$(find android/app/build/outputs/apk -name '*.apk' | sort | head -1)
          [ -n "$APK" ] || { echo "::error::没找到 APK"; exit 1; }
          mkdir -p release2
          cp "$APK" "release2/NeckGuardian-$VER-android-$kind.apk"
          echo "APK 源文件 = $APK"
          ls -lh release2/*.apk

      - name: 解出 APK 内的前端
        run: |
          APK=$(ls release2/*-android-*.apk | head -1)
          rm -rf /tmp/apk && mkdir -p /tmp/apk
          unzip -q "$APK" -d /tmp/apk
          ls /tmp/apk/assets/public/

      # 用真 APK 里的资源比对，而不是 cap 复制过去的中间目录 —— 后者绕过了
      # AGP 的资源处理（混淆/裁剪），理论上存在"中间目录对、包内不对"的可能。
      - name: 同源校验（APK 内前端 = 本次 dist）
        run: npm run verify:source -- --packed=/tmp/apk/assets/public/assets

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-Android
          path: release2/*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # iOS 归档
  #
  # 默认走**未签名归档**：足以证明 iOS 目标可编译、Capacitor 工程可用，
  # 且不需要 Apple 开发者账号就能在 CI 上跑通。
  # 要出可安装/可上架的 IPA，需要额外配置签名证书（见 docs/MULTIPLATFORM.md）。
  # ─────────────────────────────────────────────────────────────
  mobile-ios:
    name: iOS 归档
    # macos-15：`macos-14` 的弃用支持 2026-11-02 到期，别贴着期限走
    runs-on: macos-15
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 脚本内部会做三件事：前端构建（含 MediaPipe 资源暂存）→ cap sync ios
      # → pod install → xcodebuild archive（未签名）
      - name: 构建并归档
        run: node scripts/ios-build.js

      # xcarchive 是目录，打包成单个文件才能作为 artifact 上传
      - name: 打包归档
        run: |
          mkdir -p release2/ios
          tar -czf release2/ios/NeckGuardian.xcarchive.tgz -C release2/ios NeckGuardian.xcarchive

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-iOS
          path: release2/ios/NeckGuardian.xcarchive.tgz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # CD：打 tag 时把四端产物汇总成一个 **draft** Release
  #
  # 🔴 为什么是 draft 而不是直接 publish
  #    "构建成功" ≠ "能用"。mac / iOS 产物至今**没有做过真机验证**，
  #    Android 的摄像头链路也只在 v1.3.4 验过一轮。Release 一旦公开就有人下载，
  #    所以留一道人工闸门 —— 确认无误后再：
  #        gh release edit <tag> --draft=false --latest
  #    （这是刻意设计，不是没做完。要全自动就把下面的 `--draft` 去掉。）
  #
  # 🔴 Android：CI 只有在提供签名 secrets 时才出正式包，否则产出的是
  #    **debug 包（不可分发）** → 这里直接剔除，不进 Release。
  #    本机出正式包后补传：
  #        npm run cap:build:release
  #        gh release upload <tag> "release2/NeckGuardian-<ver>-android-release.apk" --clobber
  # ─────────────────────────────────────────────────────────────
  release:
    name: 发布 Release（draft）
    runs-on: ubuntu-latest
    needs:
      - desktop-windows
      - desktop-macos
      - mobile-android
      - mobile-ios
    # 只有打 tag 才发布；手动 dispatch 只构建、不碰 Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 汇总产物并核对版本号
        run: |
          set -euo pipefail
          echo "=== artifact 原始结构 ==="
          find artifacts -type f | sort

          mkdir -p dist-release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.apk' -o -name '*.tgz' \) \
            -exec cp -v {} dist-release/ \;

          echo "=== 待发布 ==="
          ls -lh dist-release/

          # tag 与 package.json 版本必须一致，否则会发出版本号对不上的 Release
          VER=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$VER  tag=$TAG"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 $VER 不一致"
            exit 1
          fi

      - name: 剔除不可分发的 Android debug 包
        run: |
          set -euo pipefail
          if ls dist-release/*-android-debug.apk >/dev/null 2>&1; then
            echo "::warning::CI 未提供签名 secrets → 只有 debug 包，已从 Release 资产中剔除"
            echo "::warning::Android 正式包请本机 npm run cap:build:release 后 gh release upload 补传"
            rm -f dist-release/*-android-debug.apk
          fi
          ls -lh dist-release/

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 / 更新 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 覆盖上传资产"
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "NeckGuardian ${TAG}" \
              --notes-file .github/release-notes.md \
              --generate-notes \
              dist-release/*
          fi

      - name: 在 Summary 里给出后续动作
        run: |
          {
            echo "## Release 已创建为 draft"
            echo
            echo "人工确认无误后发布："
            echo
            echo '```'
            echo "gh release edit ${GITHUB_REF_NAME} --draft=false --latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
