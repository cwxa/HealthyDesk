# 四端构建：Windows / macOS / Android / iOS
#
# 为什么需要 CI：
#   Windows 上**只能**构建 Windows 与 Android。macOS 与 iOS 都不行，原因是硬性的：
#     - iOS：Xcode / clang / 代码签名没有非 macOS 实现
#     - macOS：安装包要内置一个 **macOS 原生的 Python 后端**，PyInstaller 不能交叉编译
#   因此这两个产物只能交给 GitHub 的 macOS runner。
#
# 触发方式：
#   - 打 tag（v*）→ 构建四端，并自动创建一个 **draft Release**（CD）
#   - Actions 页面手动触发（workflow_dispatch）→ 只构建，不碰 Release
#
# 两道闸门（都是刻意保留的，不是没做完）：
#   1. 每个打包 job 产出后要过**同源校验**（包内前端 = 本次 dist）与**架构校验**；
#   2. CD 只创建 **draft** Release、不自动公开 —— 产物必须真机验证过再执行
#        gh release edit <tag> --draft=false --latest
#      "构建成功" ≠ "能用"，自动 publish 等于把前者当后者推到用户面前。
#
# runner 标签策略：**凡有明确迁移公告的，都钉死小版本，不用 -latest**
#   - ubuntu：`ubuntu-latest` 将于 **2026-10-19** 迁到 Ubuntu 26（CI 已在刷这条注记），
#     所以钉 `ubuntu-24.04`。要升 Ubuntu 26 时改这一处、跑一遍，而不是被动接受。
#   - macos：`macos-13` 已退役（用它 job 会**永远排队**）；Intel 只剩 `macos-15-intel`
#     （官方说这是最后一个，2027-08 后 x64 mac 只能本地产）。
#   - windows：暂用 `windows-latest`（没有近期迁移公告）。

name: 四端构建

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# 同一 ref 重复触发时，取消上一次还没跑完的。
# ⚠️ 只在手动触发时取消：**tag 触发的构建必须跑完**（它后面接着发 Release），
#    半路取消会留下一个空壳 release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 守门：跨语言一致性 / 类型 / 版本号。任一不过，四端构建都不启动。
  # ─────────────────────────────────────────────────────────────
  verify:
    name: 守门 · 一致性 / 类型 / 版本
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装前端依赖
        run: npm ci

      # 评分/角度模块只依赖 numpy（mediapipe 是惰性导入），
      # 所以重新生成期望值不需要装 opencv + mediapipe 那 400MB。
      - name: 安装后端最小依赖
        run: python -m pip install --quiet numpy

      - name: 类型检查
        run: npx tsc --noEmit

      # 期望值是由 Python 生成、node 比对的。如果只改了其中一边，
      # 提交里的 json 就会和生成器脱节 —— 这时比对本身仍在"自洽地跑"，
      # 却已经与被测实现无关了。重新生成一次并比对，堵住这个盲区。
      - name: 期望值是否与生成器同步
        run: |
          python scripts/gen-scoring-cases.py > /tmp/scoring.json
          python scripts/gen-angle-cases.py   > /tmp/angle.json
          diff -u scripts/scoring-expected.json /tmp/scoring.json
          diff -u scripts/angle-expected.json   /tmp/angle.json

      - name: 跨语言一致性（评分 / 平滑 / 角度）
        run: npm run verify:parity

      - name: 版本号五处一致
        run: node scripts/set-version.js --check

  # ─────────────────────────────────────────────────────────────
  # Windows 桌面安装包（NSIS）
  # ─────────────────────────────────────────────────────────────
  desktop-windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端（桌面模式，含 Electron 入口）
        run: npx vite build

      - name: 打后端可执行文件
        run: npm run backend:build

      # 拦住"后端产物与目标平台不符"这一整类问题
      # （打包会成功，但装到目标机器上后端永远起不来）
      - name: 校验后端产物平台
        run: npm run verify:backend

      - name: 打包安装包
        run: npx electron-builder --win --publish never

      # 打包会成功、程序也能启动，但里面的前端可能是旧 dist（残留/被覆盖/忘了重建）。
      # 这类问题只在用户手上暴露，所以发布前用内容哈希钉死。
      # 比的是 electron-builder 保留的解包目录，不需要去拆 NSIS。
      - name: 同源校验（包内前端 = 本次 dist）
        run: npm run verify:source -- --packed=release2/win-unpacked/resources/app/dist/assets

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-Windows
          path: |
            release2/*.exe
            release2/*.blockmap
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # macOS 桌面安装包（dmg + zip）
  #
  # ⚠️ 两种架构**必须分别在对应架构的 runner 上构建**：
  #    内置的 Python 后端是单架构 Mach-O，PyInstaller 不能交叉编译。
  #    macos-15-intel = Intel(x64)，macos-15 = Apple Silicon(arm64)。
  # 🔴 标签有保质期，别写死后不管：
  #    - `macos-13`（原 Intel 镜像）已于 **2025-12-04 彻底退役**。用它 job 会**永远排队**，
  #      既不报错也不失败（2026-09-23 实测：其他 job 全跑完后它仍 queued）。
  #      官方给标准 runner 的 Intel 替代标签是 `macos-15-intel`（支持到 2027-08）。
  #    - `macos-14` 的弃用支持 **2026-11-02 到期**，故 arm64 直接用 `macos-15`。
  #    - Apple 已停止支持 x86_64，`macos-15-intel` 是**最后一个** Intel 镜像；
  #      2027-08 之后 x64 包只能本地出。
  # ─────────────────────────────────────────────────────────────
  desktop-macos:
    name: macOS 安装包（${{ matrix.arch }}）
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    env:
      # CI 上没有签名证书，关掉自动发现，否则 electron-builder 会尝试签名并失败
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 缓存 pip 轮子：后端依赖里有 mediapipe + opencv，每次冷装要几分钟。
          # 缓存 key 由 requirements.txt 的内容哈希决定，改依赖才失效。
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端（桌面模式）
        run: npx vite build

      - name: 打后端可执行文件
        run: npm run backend:build

      - name: 校验后端产物平台与架构
        run: npm run verify:backend -- --target=mac --arch=${{ matrix.arch }}

      # 🔴 关掉 Spotlight 索引：electron-builder 打完 dmg 会 `hdiutil detach`，
      #    而 mds/Spotlight 正在索引刚挂载的卷时会报
      #    `hdiutil: couldn't eject "disk2" - Resource busy`（退出码 16），打包就此失败。
      #    2026-09-23 实测：arm64 同轮通过、x64 挂在这里 → 属**偶发**，不是代码问题。
      - name: 关闭 Spotlight 索引
        run: sudo mdutil -a -i off || true

      - name: 打包 dmg + zip（未签名）
        run: |
          set +e
          for attempt in 1 2 3; do
            npx electron-builder --mac --${{ matrix.arch }} --publish never
            rc=$?
            [ $rc -eq 0 ] && exit 0
            echo "::warning::electron-builder 第 $attempt 次失败（退出码 $rc），清理残留挂载点后重试"
            for vol in /Volumes/NeckGuardian*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force
            done
            sleep 10
          done
          echo "::error::electron-builder 连续 3 次失败"
          exit 1

      # 🔴 断言产物集合与本 job 的架构严格一致。
      #    背景：electron-builder.yml 里 target 层若写了 `arch:` 列表，会**静默覆盖**
      #    命令行的 `--${{ matrix.arch }}`，于是这个 job 会把另一架构的包也打一遍。
      #    那不是"多打一个包"这么轻——后端只 build 一次，另一架构的包里的后端架构是错的。
      #    校验日志全绿也拦不住，只能在这里断言产物名。
      - name: 校验只产出本架构的包
        run: |
          ls -lh release2/
          other=${{ matrix.arch == 'x64' && 'arm64' || 'x64' }}
          if ls release2/ | grep -q -- "-$other\."; then
            echo "::error::macOS ${{ matrix.arch }} 的产物里混入了 $other 的包 —— 检查 electron-builder.yml 里 target 的 arch 列表"
            exit 1
          fi
          cnt=$(ls release2/*.dmg release2/*.zip 2>/dev/null | wc -l | tr -d ' ')
          if [ "$cnt" -ne 2 ]; then
            echo "::error::期望 2 个产物（dmg + zip），实际 $cnt 个"
            exit 1
          fi

      # 包内前端必须就是本次构建的 dist（比解包目录，不用挂 dmg）
      # ⚠️ 目录名是 `mac-arm64` / `mac` 两种，用 mac* 通配，别写成 mac-*
      - name: 同源校验（包内前端 = 本次 dist）
        run: |
          APP=$(ls -d release2/mac*/NeckGuardian.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到解包后的 .app（release2/mac*/）"
            ls -la release2/
            exit 1
          fi
          echo "app = $APP"
          npm run verify:source -- --packed="$APP/Contents/Resources/app/dist/assets"

      # 🔴 产物层面的断言：下面这些东西**打包成功完全保证不了**，
      #    但缺任何一项都等于"装上去用不了"，而且报错信息会把人引向错误方向
      #    （缺权限声明 → 进程被系统直接终止，看起来像"闪退/崩溃"，不像权限问题）。
      - name: 校验包内关键资源（权限声明 / 后端架构 / 可执行位）
        run: |
          set -euo pipefail
          APP=$(ls -d release2/mac*/NeckGuardian.app | head -1)
          echo "app = $APP"

          # 1) 摄像头权限声明。macOS 上**必须**有：
          #    缺失时请求摄像头不是"权限被拒"，而是进程被系统**直接终止**。
          CAM=$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Contents/Info.plist" 2>/dev/null || true)
          if [ -z "$CAM" ]; then
            echo "::error::$APP/Contents/Info.plist 缺 NSCameraUsageDescription —— 一开摄像头进程就被终止"
            /usr/libexec/PlistBuddy -c 'Print' "$APP/Contents/Info.plist" || true
            exit 1
          fi
          echo "NSCameraUsageDescription = $CAM"

          # 2) 内置后端：必须是本架构的 Mach-O，且**保留可执行位**。
          #    可执行位在 zip 压缩 / 解压 / 复制链路里最容易静默丢失，
          #    丢了以后 spawn 报 EACCES，看起来像"后端起不来"。
          BE="$APP/Contents/Resources/neckguardian-backend/neckguardian-backend"
          if [ ! -f "$BE" ]; then
            echo "::error::包内找不到后端可执行文件：$BE"
            ls -la "$APP/Contents/Resources/" || true
            exit 1
          fi
          want=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          file "$BE"
          file "$BE" | grep -q "Mach-O 64-bit executable $want" \
            || { echo "::error::后端架构与本 job 的 ${{ matrix.arch }}（期望 $want）不符"; exit 1; }
          if [ ! -x "$BE" ]; then
            echo "::error::后端可执行文件丢了可执行位（chmod +x 后重打包）"
            ls -l "$BE"
            exit 1
          fi

      # 🔴 前面全是"静态检查产物对不对"，这一步是**唯一**能回答
      #    "这个包装在 Mac 上到底能不能跑"的自动化手段。
      #    macOS runner 就是真 Mac，直接在 .app 里把内置后端跑起来，等 /api/health。
      #    它能抓到：Mach-O 能执行 / 端口能监听 / 数据库能初始化 / 路径解析正确
      #    —— 这些在 Windows 打包时验不出来（后端必须是宿主平台编译的产物）。
      #    仍验不到的（需人工在真机跑）：Electron 窗口、摄像头链路、签名与 Gatekeeper。
      - name: 后端启动冒烟（跑 .app 内后端，等 /api/health）
        run: |
          set -euo pipefail
          APP=$(ls -d release2/mac*/NeckGuardian.app | head -1)
          BE="$APP/Contents/Resources/neckguardian-backend/neckguardian-backend"
          LOG=/tmp/backend-smoke.log
          "$BE" > "$LOG" 2>&1 &
          PID=$!
          echo "后端 PID = $PID"

          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::后端进程在就绪前就退出了（第 ${i} 次探测）"
              tail -80 "$LOG" || true
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:18920/api/health -o /tmp/health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          if [ "$ready" -ne 1 ]; then
            echo "::error::120 秒内 /api/health 未就绪"
            tail -80 "$LOG" || true
            exit 1
          fi
          echo "健康检查响应: $(cat /tmp/health.json)"
          grep -q '"status":"ok"' /tmp/health.json \
            || { echo "::error::/api/health 没有返回 status=ok"; exit 1; }
          echo "--- 后端启动日志 ---"
          tail -20 "$LOG" || true

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-macOS-${{ matrix.arch }}
          path: |
            release2/*.dmg
            release2/*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Android APK
  #
  # 本机（Windows）已经能出正式包；这个任务的价值是**在干净环境里验证可构建性**，
  # 同时避免本地工具链（E:/AndroidDev）与 CI 的差异被长期掩盖。
  # 提供签名 secrets 时出正式包，否则只出 debug 包（不可分发）。
  # ─────────────────────────────────────────────────────────────
  mobile-android:
    name: Android APK
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 不用 `android-actions/setup-android@v3`：它内部会执行 `sdkmanager tools`，
      #    而 `tools` 包早已从 SDK 仓库移除 → `Warning: Failed to find package 'tools'`
      #    然后整个 action 以退出码 1 失败（2026-09-23 CI 实测）。
      #    ubuntu runner 本身就带 Android SDK，直接用自带的即可。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::找不到 Android SDK（$SDK）"; exit 1; }
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            # runner 上 cmdline-tools 的版本目录名会变（16.0 / latest / …），按目录找而不是写死
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "SDK        = $SDK"
          echo "sdkmanager = $SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # `yes |` 会因 SIGPIPE 得到非 0 退出码，必须兜住
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: 安装依赖
        run: npm ci

      # 项目 compileSdk/targetSdk = 34，构建工具 34.0.0（见 android/variables.gradle）
      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 写入签名配置（仅在提供 secrets 时）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未提供 ANDROID_KEYSTORE_BASE64，跳过签名配置（只会产出 debug 包）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/neckguardian-release.jks"
          cat > "$GITHUB_WORKSPACE/android/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/neckguardian-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 APK
        run: |
          if [ -f android/keystore.properties ]; then
            echo "检测到签名配置 → 构建 release 包"
            node scripts/android-build.js --release
          else
            echo "::warning::未提供签名 secrets，仅产出 debug 包（不可分发）"
            node scripts/android-build.js
          fi

      # 把「是否已签名 / 能不能分发」直接写进文件名。
      # 下游的 Release 步骤靠这个后缀判断该不该上传 —— debug 包绝不能发出去。
      - name: 规范产物名
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -f android/keystore.properties ]; then kind=release; else kind=debug; fi
          APK=$(find android/app/build/outputs/apk -name '*.apk' | sort | head -1)
          [ -n "$APK" ] || { echo "::error::没找到 APK"; exit 1; }
          mkdir -p release2
          cp "$APK" "release2/NeckGuardian-$VER-android-$kind.apk"
          echo "APK 源文件 = $APK"
          ls -lh release2/*.apk

      - name: 解出 APK 内的前端
        run: |
          APK=$(ls release2/*-android-*.apk | head -1)
          rm -rf /tmp/apk && mkdir -p /tmp/apk
          unzip -q "$APK" -d /tmp/apk
          ls /tmp/apk/assets/public/

      # 用真 APK 里的资源比对，而不是 cap 复制过去的中间目录 —— 后者绕过了
      # AGP 的资源处理（混淆/裁剪），理论上存在"中间目录对、包内不对"的可能。
      - name: 同源校验（APK 内前端 = 本次 dist）
        run: npm run verify:source -- --packed=/tmp/apk/assets/public/assets

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-Android
          path: release2/*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # iOS 归档
  #
  # 默认走**未签名归档**：足以证明 iOS 目标可编译、Capacitor 工程可用，
  # 且不需要 Apple 开发者账号就能在 CI 上跑通。
  # 要出可安装/可上架的 IPA，需要额外配置签名证书（见 docs/MULTIPLATFORM.md）。
  # ─────────────────────────────────────────────────────────────
  mobile-ios:
    name: iOS 归档
    # macos-15：`macos-14` 的弃用支持 2026-11-02 到期，别贴着期限走
    runs-on: macos-15
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 脚本内部会做三件事：前端构建（含 MediaPipe 资源暂存）→ cap sync ios
      # → pod install → xcodebuild archive（未签名）
      - name: 构建并归档
        run: node scripts/ios-build.js

      # 与 Android 同理：验**归档里实际那份**（`.app/public/assets`），
      # 而不是 cap sync 复制到工程目录的中间态 —— 后者没经过 Xcode 的处理流程。
      - name: 同源校验（归档内的前端 = 本次 dist）
        run: |
          set -euo pipefail
          ASSETS="$(find release2/ios/NeckGuardian.xcarchive -type d -path '*/public/assets' | head -1)"
          if [ -z "$ASSETS" ]; then
            echo "::error::归档里找不到 public/assets，无法校验同源"
            find release2/ios/NeckGuardian.xcarchive -maxdepth 6 -type d | head -40
            exit 1
          fi
          echo "归档内前端目录 = $ASSETS"
          npm run verify:source -- --packed="$ASSETS"

      # 🔴 归档产物的静态断言。
      #    最容易踩的一条是 NSCameraUsageDescription：iOS 上缺它不是"权限被拒"，
      #    而是**一调用摄像头就闪退**，且日志里只有 SIGABRT，排查方向极易跑偏。
      - name: 校验归档产物（权限声明 / 架构 / 可安装性）
        run: |
          set -euo pipefail
          PLIST=$(find release2/ios/NeckGuardian.xcarchive -type f -path '*Products/Applications/*.app/Info.plist' | head -1)
          if [ -z "$PLIST" ]; then
            echo "::error::归档里找不到 .app/Info.plist"
            find release2/ios/NeckGuardian.xcarchive -maxdepth 6 | head -40
            exit 1
          fi
          echo "Info.plist = $PLIST"

          CAM=$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$PLIST" 2>/dev/null || true)
          if [ -z "$CAM" ]; then
            echo "::error::缺 NSCameraUsageDescription —— 装到设备后一开摄像头就闪退（不是权限被拒）"
            /usr/libexec/PlistBuddy -c 'Print' "$PLIST" || true
            exit 1
          fi
          echo "NSCameraUsageDescription = $CAM"

          # 本项目只做摄像头姿态检测、音频只做输出（Constraints: audio=false），
          # 因此**不应**出现麦克风声明；出现了说明配置漂了。
          if /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$PLIST" >/dev/null 2>&1; then
            echo "::warning::Info.plist 出现 NSMicrophoneUsageDescription，但本项目不需要麦克风"
          fi

          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          [ "$BID" = "com.neckguardian.app" ] || { echo "::error::BundleID 变成了 $BID"; exit 1; }
          echo "BundleID = $BID"

          APP=$(dirname "$PLIST")
          file "$APP/App"
          file "$APP/App" | grep -q "Mach-O 64-bit" || { echo "::error::主二进制不是 Mach-O"; exit 1; }

          # 🔴 说清楚这个产物**是什么**：CI 没有签名证书，
          #    产出的是开发者归档（xcarchive），**不是**可安装的 IPA。
          #    想装到设备必须由持有 Apple 开发者证书的人用 Xcode 重新签名导出。
          if [ -e "$APP/embedded.mobileprovision" ]; then
            echo "::warning::归档里出现了 embedded.mobileprovision（CI 未配置签名，出现在这里属异常）"
          else
            echo "::notice::该产物为未签名开发者归档（.xcarchive），不可直接安装；分发需另行签名导出 IPA"
          fi

      # xcarchive 是目录，打包成单个文件才能作为 artifact 上传
      - name: 打包归档
        run: |
          mkdir -p release2/ios
          tar -czf release2/ios/NeckGuardian.xcarchive.tgz -C release2/ios NeckGuardian.xcarchive

      - uses: actions/upload-artifact@v7
        with:
          name: NeckGuardian-iOS
          path: release2/ios/NeckGuardian.xcarchive.tgz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # CD：打 tag 时把四端产物汇总成一个 **draft** Release
  #
  # 🔴 为什么是 draft 而不是直接 publish
  #    "构建成功" ≠ "能用"。mac / iOS 产物至今**没有做过真机验证**，
  #    Android 的摄像头链路也只在 v1.3.4 验过一轮。Release 一旦公开就有人下载，
  #    所以留一道人工闸门 —— 确认无误后再：
  #        gh release edit <tag> --draft=false --latest
  #    （这是刻意设计，不是没做完。要全自动就把下面的 `--draft` 去掉。）
  #
  # 🔴 Android：CI 只有在提供签名 secrets 时才出正式包，否则产出的是
  #    **debug 包（不可分发）** → 这里直接剔除，不进 Release。
  #    本机出正式包后补传：
  #        npm run cap:build:release
  #        gh release upload <tag> "release2/NeckGuardian-<ver>-android-release.apk" --clobber
  # ─────────────────────────────────────────────────────────────
  release:
    name: 发布 Release（draft）
    runs-on: ubuntu-24.04
    needs:
      - desktop-windows
      - desktop-macos
      - mobile-android
      - mobile-ios
    # 只有打 tag 才发布；手动 dispatch 只构建、不碰 Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 汇总产物并核对版本号
        run: |
          set -euo pipefail
          echo "=== artifact 原始结构 ==="
          find artifacts -type f | sort

          mkdir -p dist-release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.apk' -o -name '*.tgz' \) \
            -exec cp -v {} dist-release/ \;

          echo "=== 待发布 ==="
          ls -lh dist-release/

          # tag 与 package.json 版本必须对得上，否则会发出版本号错乱的 Release。
          # 允许预发布后缀：v1.3.8-rc1、v1.3.8-cdverify 都按 1.3.8 校验
          # （这样预演 CD 不用动 package.json 的版本号）。
          VER=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          echo "package.json=$VER  tag=$TAG  (比对基准=$BASE)"
          if [ "$VER" != "$BASE" ]; then
            echo "::error::tag $TAG 与 package.json 版本 $VER 不一致"
            exit 1
          fi

      - name: 剔除不可分发的 Android debug 包
        run: |
          set -euo pipefail
          if ls dist-release/*-android-debug.apk >/dev/null 2>&1; then
            echo "::warning::CI 未提供签名 secrets → 只有 debug 包，已从 Release 资产中剔除"
            echo "::warning::Android 正式包请本机 npm run cap:build:release 后 gh release upload 补传"
            rm -f dist-release/*-android-debug.apk
          fi
          ls -lh dist-release/

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist-release
          # 🔴 校验和里必须写**用户在 GitHub 上下载到的文件名**，不是本地文件名。
          #    GitHub 会把资产名里的连续空白压成一个点：
          #      `NeckGuardian Setup 1.3.7.exe`  → `NeckGuardian.Setup.1.3.7.exe`
          #      `d  e.txt`（两个空格）          → `d.e.txt`（实测：连续空白合并成一个点）
          #    照抄本地名的话，用户下载后按 release 说明跑 `sha256sum -c SHA256SUMS.txt`
          #    会因为「找不到文件」而整条 FAILED —— 白给一份没法用的校验文件。
          for f in *; do
            if [ "$f" = "SHA256SUMS.txt" ]; then continue; fi
            h=$(sha256sum "$f" | awk '{print $1}')
            ghname=$(printf '%s' "$f" | sed -E 's/[[:space:]]+/./g')
            printf '%s  %s\n' "$h" "$ghname"
          done > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 / 更新 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 覆盖上传资产"
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "NeckGuardian ${TAG}" \
              --notes-file .github/release-notes.md \
              --generate-notes \
              dist-release/*
          fi

      - name: 在 Summary 里给出后续动作
        run: |
          {
            echo "## Release 已创建为 draft"
            echo
            echo "人工确认无误后发布："
            echo
            echo '```'
            echo "gh release edit ${GITHUB_REF_NAME} --draft=false --latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
